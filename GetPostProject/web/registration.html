<!--name age and gender as radio button-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
</head>
<body>
<h1>Student Registration</h1>
<form action="registration" method="post">
  Enter Student name:
  <input type="text" name="student_name"><br>
  Enter Student Age:
  <input type="text" name="student_age"><br>
  Enter Student Gender:
  <input type="radio" name="student_gender" value="Male">Male<br>
  <input type="radio" name="student_gender" value="Female">Female<br>
  <input type="radio" name="student_gender" value="Other">Other<br>
  <input type="submit" value="Submit">
</form>

</body>
</html>
